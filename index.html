<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernanwendungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111;
    --paper: #fffdf6;
    --sun: #ffd23f;
    --red: #ef3e36;
    --blue: #2e86de;
    --green: #2ecc71;
    --purple: #8e44ad;
    --orange: #ff8c1a;
    --muted: #3b3b3b;
    --stern: polygon(50% 0%,61% 18%,82% 8%,78% 30%,100% 35%,84% 52%,98% 70%,76% 72%,78% 95%,58% 82%,45% 100%,38% 80%,15% 92%,20% 68%,0% 60%,18% 46%,4% 26%,26% 26%,24% 4%,42% 18%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font: 18px/1.45 "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
    background-color: var(--sun);
    background-image: radial-gradient(rgba(0,0,0,.13) 1.6px, transparent 1.7px);
    background-size: 14px 14px;
    min-height: 100vh;
    overflow-x: clip;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Titel ---------- */
  header { padding: 40px 0 10px; text-align: center; }
  h1 {
    font-family: Bangers, Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 10vw, 6rem);
    letter-spacing: .04em;
    line-height: .95;
    margin: 0;
    color: #fff;
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 6px 6px 0 var(--red), 9px 9px 0 var(--ink);
    transform: rotate(-2deg);
  }
  .bubble {
    position: relative;
    display: inline-block;
    max-width: 560px;
    margin: 26px auto 0;
    padding: 12px 20px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    font-weight: 700;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .bubble::after {
    content: "";
    position: absolute; left: 40px; top: -21px;
    border: 10px solid transparent;
    border-bottom: 12px solid var(--ink);
  }
  .bubble::before {
    content: "";
    position: absolute; left: 43px; top: -13px;
    border: 7px solid transparent;
    border-bottom: 9px solid var(--paper);
    z-index: 1;
  }

  /* ---------- Suche & Filter ---------- */
  .tools {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
    padding: 30px 0 10px;
  }
  .search {
    flex: 1 1 260px; max-width: 420px;
    padding: 12px 16px;
    font: inherit; font-weight: 700;
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .search:focus { outline: none; box-shadow: 4px 4px 0 var(--blue); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    font-family: Bangers, Impact, sans-serif;
    font-size: 20px; letter-spacing: .05em;
    padding: 6px 14px 4px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .chip:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .chip:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .chip[aria-pressed="true"] { background: var(--red); color: #fff; }

  /* ---------- Welten (Fächer) ---------- */
  section.welt { margin: 40px 0 56px; }
  .welt-titel {
    display: inline-block;
    font-family: Bangers, Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 2.8rem);
    letter-spacing: .05em;
    margin: 0 0 6px;
    padding: 4px 22px 0;
    color: #fff;
    background: var(--farbe, var(--blue));
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    transform: rotate(-1.5deg);
    -webkit-text-stroke: 1.5px var(--ink);
    paint-order: stroke fill;
  }
  .welt-titel small { font-size: .55em; opacity: .9; margin-right: 8px; }

  .level {
    display: flex; align-items: center; gap: 10px;
    margin: 28px 0 14px;
    font-family: Bangers, Impact, sans-serif;
    font-size: 24px; letter-spacing: .05em;
  }
  .level .nr {
    display: inline-grid; place-items: center;
    width: 38px; height: 38px;
    background: var(--ink); color: var(--sun);
    border-radius: 50%;
    font-size: 20px;
  }
  .level::after { content: ""; flex: 1; border-top: 3px dashed var(--ink); }

  .grid {
    display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }

  /* ---------- Karten ---------- */
  a.card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 6px;
    color: inherit; text-decoration: none;
    box-shadow: 7px 7px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  a.card:nth-child(odd)  { transform: rotate(-.6deg); }
  a.card:nth-child(even) { transform: rotate(.6deg); }
  a.card:hover, a.card:focus-visible {
    transform: translate(-3px,-3px) rotate(0);
    box-shadow: 10px 10px 0 var(--ink);
    outline: none;
  }
  a.card:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--ink); }

  .card .kopf {
    height: 70px;
    background-color: var(--farbe, var(--blue));
    background-image:
      radial-gradient(rgba(255,255,255,.35) 2px, transparent 2.2px),
      repeating-linear-gradient(115deg, transparent 0 18px, rgba(0,0,0,.08) 18px 22px);
    background-size: 10px 10px, auto;
    border-bottom: 3px solid var(--ink);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 12px 8px;
  }
  .card .klasse {
    font-family: Bangers, Impact, sans-serif;
    font-size: 18px; letter-spacing: .05em;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 1px 8px 0;
  }
  .card .inhalt { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card strong {
    font-family: Bangers, Impact, sans-serif;
    font-weight: 400; font-size: 28px; letter-spacing: .04em; line-height: 1;
  }
  .card p { margin: 0; color: var(--muted); font-size: 16px; }
  .card .start {
    align-self: flex-start;
    margin-top: auto;
    font-family: Bangers, Impact, sans-serif;
    font-size: 22px; letter-spacing: .08em;
    padding: 5px 18px 2px;
    background: var(--green);
    color: #fff;
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    -webkit-text-stroke: 1px var(--ink);
    paint-order: stroke fill;
  }

  /* NEU!-Explosion */
  .neu {
    position: absolute; top: -24px; left: -18px;
    width: 78px; height: 78px;
    display: grid; place-items: center;
    font-family: Bangers, Impact, sans-serif;
    font-size: 22px; color: var(--ink);
    background: var(--sun);
    clip-path: var(--stern);
    transform: rotate(-12deg);
    z-index: 2;
  }
  .neu-rand {
    position: absolute; top: -28px; left: -22px;
    width: 86px; height: 86px;
    background: var(--ink);
    clip-path: var(--stern);
    transform: rotate(-12deg);
    z-index: 1;
  }

  .leer {
    text-align: center; padding: 50px 0;
    font-family: Bangers, Impact, sans-serif; font-size: 34px; letter-spacing: .05em;
  }
  footer {
    text-align: center; padding: 10px 0 40px;
    font-weight: 700;
  }
  footer span {
    display: inline-block;
    background: var(--paper); border: 3px solid var(--ink);
    padding: 6px 14px; box-shadow: 4px 4px 0 var(--ink);
    transform: rotate(1deg);
  }

  @media (prefers-reduced-motion: reduce) {
    a.card, .chip { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 id="titel">Lernanwendungen</h1>
      <div class="bubble" id="untertitel"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="tools">
      <input class="search" id="suche" type="search" placeholder="Suchen, z. B. Millikan …" aria-label="Anwendungen durchsuchen">
      <div class="chips" id="klassen" role="group" aria-label="Nach Klasse filtern"></div>
    </div>
    <div id="liste"></div>
  </main>

  <footer><span>Läuft im Browser – auch auf Tablet und Handy!</span></footer>

<script src="apps.js"></script>
<script>
  const FARBEN = ['--blue', '--red', '--green', '--purple', '--orange'];
  const liste = document.getElementById('liste');
  const suche = document.getElementById('suche');
  const klassenBox = document.getElementById('klassen');
  let klasse = 'Alle';

  document.getElementById('titel').textContent = SEITE.titel;
  document.getElementById('untertitel').textContent = SEITE.untertitel;
  document.title = SEITE.titel;

  // feste Farbe pro Fach (Reihenfolge des ersten Auftretens)
  const fachFarbe = {};
  APPS.forEach(a => {
    const f = a.fach || 'Sonstiges';
    if (!(f in fachFarbe)) fachFarbe[f] = FARBEN[Object.keys(fachFarbe).length % FARBEN.length];
  });

  const klassen = ['Alle', ...new Set(APPS.map(a => a.klasse).filter(Boolean))];
  klassen.forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = k === 'Alle' ? 'Alle Klassen' : 'Klasse ' + k;
    b.setAttribute('aria-pressed', k === klasse);
    b.onclick = () => {
      klasse = k;
      klassenBox.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      zeichnen();
    };
    klassenBox.appendChild(b);
  });

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function zeichnen() {
    const q = suche.value.trim().toLowerCase();
    const treffer = APPS.filter(a =>
      (klasse === 'Alle' || a.klasse === klasse) &&
      (!q || [a.titel, a.thema, a.fach, a.beschreibung].join(' ').toLowerCase().includes(q))
    );

    liste.innerHTML = '';
    if (!treffer.length) {
      liste.appendChild(el('p', 'leer', 'Hoppla! Nichts gefunden …'));
      return;
    }

    const faecher = {};
    treffer.forEach(a => {
      const f = a.fach || 'Sonstiges', t = a.thema || 'Allgemein';
      (faecher[f] ??= {})[t] ??= [];
      faecher[f][t].push(a);
    });

    Object.keys(faecher).sort().forEach(f => {
      const sec = el('section', 'welt');
      sec.style.setProperty('--farbe', `var(${fachFarbe[f] || '--blue'})`);
      const h = el('h2', 'welt-titel');
      h.appendChild(el('small', null, 'Welt'));
      h.appendChild(document.createTextNode(f));
      sec.appendChild(h);

      Object.keys(faecher[f]).sort().forEach((t, i) => {
        const lv = el('div', 'level');
        lv.appendChild(el('span', 'nr', String(i + 1)));
        lv.appendChild(el('span', null, t));
        sec.appendChild(lv);

        const grid = el('div', 'grid');
        faecher[f][t].forEach(a => {
          const card = el('a', 'card');
          card.href = a.datei;
          if (a.neu) {
            card.appendChild(el('span', 'neu-rand'));
            card.appendChild(el('span', 'neu', 'NEU!'));
          }
          const kopf = el('div', 'kopf');
          kopf.appendChild(el('span'));
          if (a.klasse) kopf.appendChild(el('span', 'klasse', 'Kl. ' + a.klasse));
          card.appendChild(kopf);
          const inhalt = el('div', 'inhalt');
          inhalt.appendChild(el('strong', null, a.titel));
          if (a.beschreibung) inhalt.appendChild(el('p', null, a.beschreibung));
          inhalt.appendChild(el('span', 'start', 'Start ▶'));
          card.appendChild(inhalt);
          grid.appendChild(card);
        });
        sec.appendChild(grid);
      });
      liste.appendChild(sec);
    });
  }

  suche.addEventListener('input', zeichnen);
  zeichnen();
</script>
</body>
</html>
